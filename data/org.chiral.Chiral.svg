<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Chiral: a frame with four hidden edges (files, windows, command bar, Claude) and a spark inside -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f55"/>
      <stop offset="1" stop-color="#11142a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e8ae55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8ae55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="57.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- the four edges -->
  <rect x="88"  y="40"  width="80" height="14" rx="7" fill="#e8ae55"/>   <!-- top: command bar -->
  <rect x="40"  y="88"  width="14" height="80" rx="7" fill="#6cc3ae"/>   <!-- left: file tree -->
  <rect x="88"  y="202" width="80" height="14" rx="7" fill="#7fa8e0"/>   <!-- bottom: windows -->
  <rect x="202" y="88"  width="14" height="80" rx="7" fill="#e27d6f"/>   <!-- right: Claude -->
  <!-- the spark -->
  <circle cx="128" cy="128" r="54" fill="url(#glow)"/>
  <path d="M128 84 C133 116 140 123 172 128 C140 133 133 140 128 172 C123 140 116 133 84 128 C116 123 123 116 128 84 Z" fill="#fff4dc"/>
</svg>
